<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Audify Settings</title>
    <link rel="stylesheet" href="css/ui.css">
    <script src="js/common.js" defer></script>
    <script src="js/sounds.js" defer></script>
    <script src="js/ui.js" defer></script>
  </head>
  <body class="options">
    <main>
      <header class="top">
        <div class="brand">
          <img src="img/icon.png" alt="">
          <div>
            <h1>Audify</h1>
            <p>Instant, synthesized sound feedback for buttons and links on every site</p>
          </div>
        </div>
        <label class="switch" title="Turn all sounds on or off">
          <input type="checkbox" id="enabled" role="switch" aria-label="All sounds">
          <span class="switch-track" aria-hidden="true"></span>
        </label>
      </header>

      <div class="layout">
        <aside class="settings-col when-on">
          <h3 class="col-title">Sounds</h3>
          <div class="card" id="actions"></div>

          <h3 class="col-title">Playback</h3>
          <div class="card">
            <div class="row volume">
              <span>Volume</span>
              <input type="range" id="volume" min="0" max="100" step="1" aria-label="Volume">
              <output id="volume-text"></output>
            </div>
            <label class="row">
              <span>Vary pitch slightly</span>
              <span class="switch">
                <input type="checkbox" id="vary-pitch" role="switch">
                <span class="switch-track" aria-hidden="true"></span>
              </span>
            </label>
          </div>

          <h3 class="col-title">Muted sites</h3>
          <div class="card" id="disabled-sites"></div>
        </aside>

        <div id="catalog" class="when-on"></div>
      </div>
    </main>
  </body>
</html>
